name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libssl-dev xxd python3 netcat-openbsd

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl coreutils

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -Wall -Wextra -Wpedantic -O2 -o minicat minicat.c
          gcc -Wall -Wextra -Wpedantic -O2 -DWITH_SSL -o minicat_ssl minicat.c -lssl -lcrypto
          gcc -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -o minicat_asan minicat.c
          ls -lh minicat
          ./minicat -h | head -5

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          clang -Wall -Wextra -Wpedantic -O2 -o minicat minicat.c
          ./minicat -h | head -5

      - name: Test — release battery (Linux)
        if: runner.os == 'Linux'
        run: |
          bash MINICAT_tests.sh .

      - name: Test — smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          ./minicat -l -p 19999 -x > /tmp/srv.log 2>&1 &
          SP=$!
          sleep 1
          echo "SMOKE" | timeout 5 ./minicat 127.0.0.1 19999
          sleep 1
          kill -9 $SP 2>/dev/null || true
          grep -q 'HEX(5)' /tmp/srv.log && echo "TCP relay OK"
          ./minicat -l -H -p 19998 &
          SP=$!
          sleep 1
          curl -s http://127.0.0.1:19998/health | grep -q '200' && echo "HTTP OK"
          kill -9 $SP 2>/dev/null || true
          echo "ALL TESTS PASSED"
