name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Compile (Linux epoll)
        if: runner.os == 'Linux'
        run: |
          gcc -o minicat minicat_breakthrough.c -Wall -O2
          strip minicat
          ls -lh minicat
          echo "=== BINARY SIZE ==="
          stat --format=%s minicat
          echo "=== DEPENDENCIES ==="
          ldd minicat || true
          echo "=== HELP ==="
          ./minicat -h
          echo "=== TEST: TCP SERVER ==="
          timeout 3 ./minicat -l -p 19999 &
          sleep 1
          echo "TEST" | timeout 2 ./minicat 127.0.0.1 19999
          gs_total=$(echo "TEST" | timeout 2 ./minicat 127.0.0.1 19999)
          echo "Got: $gs_total"
          echo "=== TEST: HTTP SERVER ==="
          timeout 5 ./minicat -l -H -p 19998 &
          sleep 1
          curl -s http://127.0.0.1:19998/health
          echo ""
          curl -s http://127.0.0.1:19998/json
          echo ""
          echo "=== TEST: WEBSOCKET + CHAT ==="
          timeout 5 ./minicat -l -W -K -p 19997 &
          sleep 1
          echo "=== TEST: PROXY ==="
          timeout 5 ./minicat -l -P -p 19996 &
          sleep 1
          curl -s -x http://127.0.0.1:19996 http://example.com -o /dev/null -w "%{http_code}"
          echo ""
          echo "ALL TESTS PASSED"

      - name: Compile (macOS kqueue)
        if: runner.os == 'macOS'
        run: |
          clang -o minicat minicat_breakthrough.c -Wall -O2
          strip minicat
          ls -lh minicat
          echo "=== HELP ==="
          ./minicat -h
          echo "=== TEST: TCP SERVER ==="
          timeout 3 ./minicat -l -p 19999 &
          sleep 1
          echo "TEST" | timeout 2 ./minicat 127.0.0.1 19999
          echo "=== TEST: HTTP SERVER ==="
          timeout 5 ./minicat -l -H -p 19998 &
          sleep 1
          curl -s http://127.0.0.1:19998/health
          echo ""
          echo "=== TEST: PROXY ==="
          timeout 5 ./minicat -l -P -p 19996 &
          sleep 1
          curl -s -x http://127.0.0.1:19996 http://example.com -o /dev/null -w "%{http_code}"
          echo ""
          echo "ALL TESTS PASSED"